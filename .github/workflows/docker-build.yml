# GitHub Actions Workflow: Docker Build
# Builds the Docker image on push/PR
# Note: This is a build-only workflow; image push is not automated

name: Docker Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.txt"
      - "backend/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.txt"
      - "backend/**"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: caselibrary:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
