<html lang="en">
<head>

<style>
:root{--surface:#fffef9;--alt:#f8f6ef;--border:#d8d5ca;--text:#202522;--muted:#5f6863;--blue:#315d8d;--blue-soft:#e7eef6;--rust:#a4412b;--rust-soft:#f7e8e3;--teal:#176c68;--teal-soft:#edf5f3;--amber:#8a6418;--amber-soft:#f8f0dc;--ink:#202522;--ai:#3d5aa8;--ai-soft:#f1f4fb;--serif:"Newsreader",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#fffef9;color:var(--text);font:14px/1.5 "Inter",system-ui,sans-serif;min-height:100vh}
a{color:var(--blue)}
button{font-family:inherit}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.top .brand{font-weight:800;letter-spacing:-.03em;font-size:16px;color:var(--text);text-decoration:none}.top .sp{flex:1}
.top a.exit{font-weight:600;font-size:12.5px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:5px;padding:9px 12px;text-decoration:none}
body.framed .top{display:none}
#ribbon{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:7px 14px;background:repeating-linear-gradient(-45deg,#111 0 12px,#f5c400 12px 24px)}
#ribbon span{background:#111;color:#f5c400;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:3px;font-size:11.5px;text-align:center}

.wrap{max-width:1360px;margin:0 auto;padding:16px 18px 40px}
#dnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
#dnav button{padding:9px 14px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text);font:600 13px/1 inherit;font-family:inherit;cursor:pointer}
#dnav button:hover{border-color:var(--text)}
#dnav button.on{background:var(--ink);border-color:var(--ink);color:#fff}

#dnav .sep{width:1px;background:var(--border);margin:0 4px}
.intro{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.intro h1{margin:0;font:600 28px/1.15 var(--serif)}.intro p{margin:4px 0 0;max-width:70ch;font-size:15px;color:var(--text)}
.intro .grow{flex:1;min-width:260px}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:1px}
.c-built{background:var(--teal-soft);color:var(--teal)}.c-mock{background:var(--amber-soft);color:var(--amber)}.c-ai{background:#efe9f7;color:#5b3f8c}.c-con{background:#efe9f7;color:#5b3f8c}.c-grey{background:#ecebe4;color:var(--muted)}.c-blue{background:var(--blue-soft);color:var(--blue)}.c-rust{background:var(--rust-soft);color:var(--rust)}
.pane{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:14px 16px}
.pane h3{margin:0 0 8px;font:600 18px var(--serif)}
.pane h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mut{color:var(--muted);font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #ecebe4;flex-wrap:wrap}.row:first-child{border-top:0}.row .grow{flex:1;min-width:120px}
.btn{display:inline-block;padding:7px 14px;border-radius:5px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:600 12.5px/1.2 inherit;font-family:inherit;cursor:pointer;text-decoration:none}
.btn:hover{background:#a4412b;border-color:#a4412b}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--border)}.btn.ghost:hover{border-color:var(--ink);background:#fff;color:var(--ink)}.btn.sm{padding:4px 9px;font-size:11.5px}.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:#fff}.seg button{padding:6px 11px;border:0;border-right:1px solid var(--border);background:#fff;font:600 12px/1 inherit;font-family:inherit;color:var(--muted);cursor:pointer}.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:#fff}
.fc{padding:4px 11px;border:1px solid var(--border);border-radius:999px;background:#fff;font:600 12px/1.2 inherit;font-family:inherit;cursor:pointer;color:var(--text)}.fc.on{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}.fc:hover{border-color:var(--text)}
input[type=text],input[type=search],textarea,select{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--text);width:100%}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:11.5px;flex:0 0 auto}.avatar.t{background:var(--teal-soft);color:var(--teal)}.avatar.a{background:var(--amber-soft);color:var(--amber)}.avatar.b{width:48px;height:48px;font-size:15px}
.cmt{display:flex;gap:9px;margin-top:10px;font-size:13px}.cmt .bub{flex:1;padding:8px 10px;border-radius:6px;background:var(--alt);border:1px solid #ecebe4}.cmt .bub.new{animation:fade .6s ease both;border-color:var(--teal)}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.flash{animation:flash 1.4s ease}@keyframes flash{0%,40%{background:#fbe7a1}100%{background:transparent}}
mark{background:#fbe7a1;padding:0 2px;border-radius:2px}mark.sel{background:#f5c400}
.doc{font-family:var(--serif);font-size:16px;line-height:1.6}
.empty{padding:26px 14px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:8px;background:var(--alt)}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;padding-top:6px}.bars .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;min-width:0}.bars .c i{display:block;background:var(--teal);border-radius:2px 2px 0 0;min-height:2px}.bars .c i.f{background:#f5c400;border-radius:0}.bars-x{display:flex;gap:5px;font-size:10.5px;color:var(--muted)}.bars-x span{flex:1;text-align:center;min-width:0;overflow:hidden}
.hb{display:grid;grid-template-columns:90px 1fr 80px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}.hb .t{height:12px;border-radius:3px;background:#ecebe4;overflow:hidden}.hb .t i{display:block;height:100%;background:var(--teal)}
.sitehd{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border:1px solid var(--border);border-radius:8px 8px 0 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap}.tabs button{padding:9px 14px;border:0;border-bottom:2px solid transparent;background:none;font:600 12.5px/1 inherit;font-family:inherit;letter-spacing:.04em;color:var(--muted);cursor:pointer}.tabs button.on{color:var(--text);border-bottom-color:var(--text)}.tabs button:hover{color:var(--text)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;padding:10px 16px;border-radius:8px;background:var(--ink);color:#fff;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100vw - 30px);animation:fade .25s ease both}
.lay{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:0;border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden;min-height:480px}
.lay>div{padding:14px 16px;min-width:0}.lay>div+div{border-left:1px solid var(--border)}
.lay .side{background:var(--alt)}
.item{display:block;width:100%;text-align:left;padding:8px 10px;border:1px solid transparent;border-radius:6px;background:none;font:inherit;color:var(--text);cursor:pointer}.item:hover{background:#fff;border-color:var(--border)}.item.on{background:#fff;border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.item small{display:block;color:var(--muted);font-size:11.5px}
.sp{height:8px}
.p-r{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:9px 8px 9px 8px;border-left:4px solid transparent;border-radius:4px;cursor:pointer;transition:opacity .2s}.p-r:hover{background:var(--alt)}.p-r.sel{background:#f1f4fb;border-left-color:var(--ai)!important}.p-r.dim{opacity:.28}
.p-r .no{color:var(--muted);font-weight:600;font-size:12.5px;padding-top:2px}.p-r .txt{font-family:var(--serif);font-size:15.5px;line-height:1.55}
.p-r.court{border-left-color:var(--teal)}.p-r.resp{border-left-color:var(--rust)}.p-r.app{border-left-color:var(--blue)}.p-r.below{border-left-color:var(--amber)}.p-r.nol{border-left-color:transparent}
.sec{margin:12px 0 4px;padding:6px 8px;font:700 13px var(--serif);letter-spacing:.05em;text-transform:uppercase;background:var(--alt);border-radius:4px}
.pos{padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:6px;font-family:"Inter",sans-serif;display:inline-block}.pos.court{background:var(--teal-soft);color:var(--teal)}.pos.resp{background:var(--rust-soft);color:var(--rust)}.pos.app{background:var(--blue-soft);color:var(--blue)}.pos.below{background:var(--amber-soft);color:var(--amber)}.pos.evid{background:#ecebe4;color:var(--muted)}
.sum{margin-top:5px;padding:5px 9px;border-radius:5px;background:var(--ai-soft);font:13px/1.45 "Inter",sans-serif}
.prop{margin-top:5px;padding:5px 9px;border:1px solid #dbe3f3;border-radius:5px;background:#fff;font:12.5px/1.4 "Inter",sans-serif}.prop b{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ai)}
.cite{display:inline-block;padding:1px 8px;border:1px solid var(--ai);border-radius:4px;background:var(--ai-soft);color:#1d2a4a;font:600 12px "Inter",sans-serif;cursor:pointer}.cite:hover,.cite.on{background:var(--ai);color:#fff}
.fn{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:#1d2a4a;color:#dbe5ff;font:700 11px "Inter",sans-serif}
.blk{margin-top:8px;padding:8px 11px;border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:5px;background:#fff;font-size:13px}.blk.resp{border-left-color:var(--rust)}.blk.app{border-left-color:var(--blue)}.blk.issue{border-left-color:#1d2a4a;background:var(--ai-soft)}.blk.below{border-left-color:var(--amber)}
.blk b.k{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.limits{margin-top:12px;padding:10px 14px;border:1px solid var(--text);border-radius:6px;background:var(--alt);font-size:13px}.limits b{font-family:var(--serif);font-size:15px}
.lk{color:var(--blue);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font:inherit}
@media(max-width:900px){.lay{grid-template-columns:minmax(0,1fr)!important}.sitehd{flex-wrap:wrap}.two,.three{grid-template-columns:minmax(0,1fr)!important}.lay>div+div{border-left:0;border-top:1px solid var(--border)}.two,.three{grid-template-columns:1fr}.wrap{padding:12px 12px 30px}.intro h1{font-size:23px}}

.menu{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.menu .mh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}.menu .mh b{font:600 15px var(--serif)}.menu .mh span{color:var(--muted);font-size:13px}
#dnav{margin:0 0 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}#dnav button{display:block;text-align:left;padding:12px 14px !important;line-height:1.35}#dnav button b{display:block;font:600 14.5px var(--sans)}#dnav button span{display:block;margin-top:3px;font:400 12.5px/1.4 var(--sans);color:var(--muted)}#dnav button.on span{color:#cfd3d0}
#dnav .gl{font:600 13px var(--sans);color:var(--muted);min-width:118px}
#dnav button{border-radius:6px !important;padding:9px 13px}
#dnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#demo{border:2px solid var(--ink);border-radius:10px;background:var(--surface);overflow:hidden}
.stagebar{display:flex;gap:10px;align-items:baseline;background:var(--ink);color:#fff;padding:9px 18px}.stagebar span{font-size:12.5px;color:#cfd3d0}.stagebar b{font:600 15px var(--sans)}
.stagebody{padding:18px 20px}
.chip,.pos,.fn,.fc,.seg,.seg button,.cite{border-radius:6px !important}
.pane h4,.blk b.k{font:600 13.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--muted)}
</style>
</head>

var LIB_ITEMS=[
 {id:'33',kind:'act',n:'33',t:'Rules of interpretation',paras:{a:'The facts that constitute inadmissibility under sections 34 to 37 include facts arising from omissions and, unless otherwise provided, include facts for which there are reasonable grounds to believe that they have occurred, are occurring or may occur.'}},

  if(sel.cites){side+=sel.cites.map(function(c){var a=RAUTH[c];return '<div class="blk '+(a.found&&!a.q?'':'below')+'"><b class="k">Authority cited in ¶'+sel.n+'</b><b>'+esc(a.n)+'</b> <span class="mut">'+a.c+'</span><p style="margin:6px 0 0">'+(a.found?(a.q?'<span class="chip c-mock">Questioned since</span> ':'<span class="chip c-built">Found in the library</span> ')+esc(a.line):'<span class="chip c-rust">Not found</span> The library has no decision with this citation. It may be mistyped, a decision we do not hold, or not a real decision. Check it before relying on it.')+'</p>'+(a.found?'<button type="button" class="btn ghost sm" data-a="open" data-v="'+esc(a.n)+'">Open the case</button>':'<button type="button" class="btn ghost sm" data-a="rdfix" data-v="'+c+'">Search for a similar citation</button>')+'</div>';}).join('');}
  var el=ELSE[sel.n];
  if(el){var rows=el.filter(function(e){return R.side==='all'||e[2]===R.side;});side+='<div class="blk issue"><b class="k">Argued elsewhere</b><div style="margin:4px 0">'+fcs('rdside',[['all','Both sides'],['app','Applicant'],['resp','Minister']],R.side)+'</div>'+(rows.length?rows.map(function(e){return '<div class="row" style="padding:6px 0"><span class="grow"><b>'+e[0]+'</b> <span class="mut">'+e[1]+'</span><br><span class="mut">'+(e[2]==='app'?'Applicant':'Minister')+': '+esc(e[4])+'</span></span><span class="chip '+(e[3]==='Allowed'?'c-built':'c-grey')+'">'+e[3]+'</span></div>';}).join(''):'<div class="empty" style="padding:12px">No decision in this demo matches that side.</div>')+'<p class="mut" style="margin:6px 0 0">These are decisions where a similar argument was made. They show what happened, not what will happen to this memo.</p></div>';}
  if(!sel.cites&&!el)side+='<div class="blk"><b class="k">¶'+sel.n+' · '+KL[sel.k][0]+'</b>No citations or similar arguments to show for this paragraph.'+(sel.k==='concl'?'<p class="mut" style="margin:6px 0 0">Prompt, not a verdict: the memo leans on five authorities. One could not be found and one has been questioned.</p>':'')+'</div>';
 }else side='<div class="empty">Click a memo paragraph to see its authorities and where similar arguments were made. Or use the tabs above for the whole memo.</div>';
 var card=function(n,l,warn){return '<div class="pane" style="text-align:center;padding:10px 6px"><b style="font:700 24px var(--serif);color:'+(warn?'var(--rust)':'inherit')+'">'+n+'</b><div class="mut" style="font-size:12px">'+l+'</div></div>';};
 var summary='<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px">'+card(MEMO.length,'paragraphs read')+card(args.length,'arguments found')+card(auths.length,'authorities cited')+card(flags,'to check',flags)+card(SUGG.length,'suggestions')+'</div>';
 return intro+'<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><span class="chip c-grey">Sample memo · invented</span><button type="button" class="fc'+(R.labels?' on':'')+'" data-a="rdlabels" aria-pressed="'+(R.labels?'true':'false')+'">Show structure labels</button><button type="button" class="btn ghost sm" data-a="rdexport">Export a checklist</button><button type="button" class="btn ghost sm" data-a="rdclose">Close memo</button></div>'+summary+'<div class="lay" style="grid-template-columns:minmax(0,1fr) 380px;min-height:0"><div>'+main+'</div><div><div style="margin-bottom:10px">'+tabs+'</div>'+side+'</div></div><div class="limits"><b>About this demo.</b> The reader would point at what to check: a citation it cannot find, a case questioned since, an argument made the other way elsewhere. It would not tell you who is right, and its labels have not been checked by a lawyer.</div>';}

/* ================= router / render ================= */
var VIEWS={scc:renderSCC,home:renderHome,library:renderLibrary,tags:renderTags,teams:renderTeams,rx:renderRX,ai:renderAI,cite:renderCite,reader:renderReader};
var DESC={library:'Search the law and see the decisions tied to a paragraph',tags:'Pick a tag and see the words that triggered it',teams:'Join a team, share an insight, comment on a draft',scc:'Factums and hearing material beside the decision',rx:'Outline, short card, notes and related paragraphs',ai:'A decision split by speaker, question and story',cite:'How a court used each case it cited',reader:'A draft with its authorities, flags and arguments'};function renderTabs(){document.getElementById('dnav').innerHTML=TABS.map(function(t){return '<button type="button" data-a="go" data-v="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'"'+(S.tab===t[0]?' aria-current="page"':'')+'><b>'+t[1]+'</b><span>'+DESC[t[0]]+'</span></button>';}).join('');}
function render(){var act=document.activeElement,key=null,pos=null;
 if(act&&act!==document.body&&document.getElementById('demo').contains(act)){key=act.id?('#'+act.id):(act.getAttribute('data-i')?('[data-i="'+act.getAttribute('data-i')+'"]'):null);try{pos=[act.selectionStart,act.selectionEnd];}catch(e){}}
 var ai=S.tab==='ai'||S.tab==='reader'||S.tab==='cite';document.body.className=(document.body.className.replace(/\bai\b/g,'').trim()+(ai?' ai':'')).trim();
 document.getElementById('ribbon').innerHTML='<span>Demo · invented data only</span><span>Not connected to the library</span>'+(ai?'<span>Needs a private AI · not built</span>':'');
 var vh=VIEWS[S.tab]();if(S.tab!=='home'&&vh.indexOf('class="limits"')<0)vh+='<div class="limits"><b>About this demo.</b> This is a picture of an idea, drawn with invented names and figures. It is not a screen from the site.</div>';var ttl=TABS.filter(function(t){return t[0]===S.tab;})[0][1];document.getElementById('demo').innerHTML='<div class="stagebar"><span>Now showing</span><b>'+ttl+'</b></div><div class="stagebody">'+vh+'</div>';renderTabs();
 if(key){var e=document.querySelector(key);if(e){e.focus();if(pos&&pos[0]!=null){try{e.setSelectionRange(pos[0],pos[1]);}catch(x){}}}}}
function reset(){var t=S.tab;if(t==='library')S.lib=libInit();if(t==='tags')S.tags=tagsInit();if(t==='rx')S.rx=rxInit();if(t==='cite')S.ct=ctInit();if(t==='teams')S.tm=teamsInit();if(t==='ai')S.ai=aiInit();if(t==='reader')S.rd=rdInit();if(t==='scc')S.scc=sccInit();toast('Demo reset.');}
function goto(el,id){var e=document.getElementById(id);if(e){e.scrollIntoView({behavior:'smooth',block:'center'});e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash');}}
function act(a,v,el){var L=S.lib,T=S.tags,M=S.tm,A=S.ai,R=S.rd,X=S.rx,Q=S.ct,again=true,after=null;
 switch(a){
 case 'go':document.getElementById('toast').hidden=true;if(TABS.some(function(t){return t[0]===v;})){S.tab=v;try{history.replaceState(null,'','#'+v);}catch(e){}window.scrollTo(0,0);}break;
 case 'reset':reset();break;
 case 'open':toast('The real site would open '+v+' in the case reader. This demo stays on fixed data.');again=false;break;
 case 'libsel':L.sel=v;L.para='';L.tab='dec';break;
 case 'libpara':L.para=L.para===v?'':v;break;
 case 'libtype':L.type=v;break;case 'libcourt':L.court=v;break;case 'libout':L.out=v;break;case 'libsort':L.sort=v;break;case 'libtab':L.tab=v;break;
 case 'libopen':L.open[v]=!L.open[v];break;
 case 'tagmode':T.mode=v;break;
 case 'tagsel':T.sel[v]=!T.sel[v];T.ev=null;break;
 case 'tagclear':T.sel={};T.ev=null;break;
 case 'tagev':T.ev=Number(v);after='td'+v;break;
 case 'tmsign':M.stage='home';break;
 case 'tmout':M.stage='signin';break;
 case 'tmhome':M.stage='home';break;
 case 'tmopen':M.cur=v;M.stage='team';M.tab='feed';M.comp=null;break;
 case 'tmjoin':M.joined[v]=true;toast('Joined '+M.teams[v].name+'.');break;
 case 'tmleave':M.joined[v]=false;if(M.stage==='team')M.stage='home';toast('You left the team.');break;
 case 'tmtab':M.tab=v;M.comp=null;break;
 case 'shvis':M.shv=v;break;
 case 'tmshare':var tx=(M.draft||'').trim();if(!tx){toast('Write something to share first.');again=false;break;}
  var dd=PINDEC.filter(function(d){return d[0]===M.shd;})[0];team().feed.unshift({who:M.me,when:'just now',txt:tx+(dd?' ['+dd[1]+', '+dd[2]+']':''),vis:M.shv||'team',fresh:1});M.draft='';M.shd='';toast((M.shv==='me'?'Saved for you only.':'Shared with the team.'));break;
 case 'tmpin':var pn=team().pins;if(pn[v])delete pn[v];else pn[v]={by:M.me,note:'',vis:'team'};break;
 case 'tmpvis':team().pins[v].vis=team().pins[v].vis==='team'?'me':'team';toast(team().pins[v].vis==='team'?'Shared with the team.':'Only you can see this pin.');break;
 case 'tmnewdoc':team().hasDoc=true;team().comments=[];toast('Draft started. Add a comment on any paragraph.');break;
 case 'tmshowres':M.showRes=!M.showRes;break;
 case 'tmcomment':M.comp=v;M.cd='';break;
 case 'tmreply':M.comp='r'+v;M.cd='';break;
 case 'tmcancel':M.comp=null;break;
 case 'tmsend':var ct=(M.cd||'').trim();if(!ct){toast('Write something first.');again=false;break;}
  if(v[0]==='p'){team().comments.push({id:nextId++,p:Number(v.slice(1)),who:M.me,txt:ct,res:false,rep:[],fresh:1});}
  else{team().comments.forEach(function(c){if(c.id===Number(v.slice(1)))c.rep.push({who:M.me,txt:ct});});}
  M.comp=null;M.cd='';toast('Comment posted for the team.');break;
 case 'tmres':team().comments.forEach(function(c){if(c.id===Number(v))c.res=!c.res;});break;
 case 'tminvite':toast('Invitation sent (pretend).');again=false;break;
 case 'aipar':A.sel=A.sel===Number(v)?null:Number(v);break;
 case 'aicite':A.card=A.card===v?null:v;break;
 case 'aicard':A.card=null;break;
 case 'ailayer':A.layers[v]=A.layers[v]?0:1;break;
 case 'aiview':A.view=v;A.flashIss=null;break;
 case 'aispk':A.spk=v;break;
 case 'aigo':A.view='par';A.spk='all';A.sel=Number(v);after='ap'+v;break;
 case 'aiissue':A.view='iss';A.flashIss=v;after='is'+v;break;
 case 'scctab':S.scc.tab=v;break;
 case 'sccside':S.scc.side=v;break;
 case 'sccout':S.scc.out=v;break;
 case 'sccpt':S.scc.sel=v;S.scc.tab='cmp';S.scc.side='all';S.scc.out='all';break;
 case 'sccgo':S.scc.tab='dec';after='sc'+v;break;
 case 'rdload':R.loaded=true;break;
 case 'rdtab':R.tab=v;break;
 case 'rdgo':R.tab='par';R.sel=Number(v);after='mp'+v;break;
 case 'rdexport':toast('Would download a one-page checklist of the flags. Not built.');again=false;break;
 case 'rxopt':X[v]=!X[v];break;
 case 'rxsec':X.sec=Number(v);after='ap'+v;break;
 case 'rxrel':X.open=X.open===Number(v)?null:Number(v);break;
 case 'ctf':Q.f=v;Q.sel=null;break;
 case 'ctsel':Q.sel=Q.sel===v?null:v;break;
 case 'rdclose':S.rd=rdInit();break;
 case 'rdlabels':R.labels=!R.labels;break;
 case 'rdpar':R.sel=R.sel===Number(v)?null:Number(v);break;
 case 'rdside':R.side=v;break;
 case 'rdfix':toast('Would search the library for citations close to “'+RAUTH[v].c+'”. None found in this demo.');again=false;break;
 default:again=false;}
 if(again){render();if(after)setTimeout(function(){goto(el,after);},30);}}
document.addEventListener('click',function(e){window.__cy=e.pageY;var el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')return;act(el.getAttribute('data-a'),el.getAttribute('data-v'),el);});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.p-r[data-a]')){e.preventDefault();e.target.click();}});
document.addEventListener('input',function(e){var el=e.target,i=el.getAttribute&&el.getAttribute('data-i');if(!i)return;var v=el.type==='checkbox'?el.checked:el.value;
 switch(i){case 'libq':S.lib.q=v;render();break;case 'libver':S.lib.ver=Number(v);render();break;
 case 'tmme':S.tm.me=v;break;case 'shtxt':S.tm.draft=v;break;case 'shdec':S.tm.shd=v;break;case 'comp':S.tm.cd=v;break;}});
document.addEventListener('change',function(e){var el=e.target,c=el.getAttribute&&el.getAttribute('data-c');if(c==='tmnote'){var p=team().pins[el.getAttribute('data-v')];if(p){p.note=el.value;toast('Note saved.');}}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.getAttribute&&e.target.getAttribute('data-c')==='tmnote')e.target.blur();});
if(window.top!==window)document.body.className+=' framed';
var h0=(location.hash||'').replace('#','');if(TABS.some(function(t){return t[0]===h0;}))S.tab=h0;
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','');if(h!==S.tab&&TABS.some(function(t){return t[0]===h;})){S.tab=h;render();}});
render();
})();
