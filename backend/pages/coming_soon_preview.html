<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iLit: coming soon preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap" rel="stylesheet">
<style>
:root{--surface:#fffef9;--alt:#f8f6ef;--border:#d8d5ca;--text:#202522;--muted:#5f6863;--blue:#315d8d;--blue-soft:#e7eef6;--rust:#a4412b;--teal:#176c68;--teal-soft:#edf5f3;--amber:#8a6418;--amber-soft:#f8f0dc;--ink:#202522;--serif:"Newsreader",Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#efede4;color:var(--text);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh;padding-bottom:96px}
a{color:var(--blue)}
.top{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.top .brand{font-weight:800;letter-spacing:-.03em;font-size:16px;color:var(--text);text-decoration:none}
.top .sp{flex:1}
.top a.exit{font-weight:600;font-size:12.5px;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:5px;padding:9px 12px;text-decoration:none}
#ribbon{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:7px 14px;background:repeating-linear-gradient(-45deg,#111 0 12px,#f5c400 12px 24px)}
#ribbon span{background:#111;color:#f5c400;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:3px;font-size:11.5px;text-align:center}
body.ai #ribbon{background:repeating-linear-gradient(-45deg,#1d2a4a 0 12px,#5b7fc7 12px 24px)}
body.ai #ribbon span{background:#1d2a4a;color:#cfdcff}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px}
.grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:22px;align-items:start}
.card{position:sticky;top:14px;padding:20px 22px;border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:8px;background:var(--surface)}
body.ai .card{border-left-color:#3d5aa8}
.kicker{color:var(--teal);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
body.ai .kicker{color:#3d5aa8}
.card h1{margin:6px 0 0;font:600 25px/1.2 var(--serif)}
.card p{margin:10px 0 0;font-size:15.5px;line-height:1.55}
.card .aside{margin-top:14px;padding:9px 12px;border-radius:5px;background:var(--alt);font-size:13px;color:var(--muted)}
.chip{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:1px}
.c-built{background:var(--teal-soft);color:var(--teal)}.c-mock{background:var(--amber-soft);color:var(--amber)}.c-ai{background:#1d2a4a;color:#dbe5ff}.c-grey{background:#ecebe4;color:var(--muted)}.c-blue{background:var(--blue-soft);color:var(--blue)}
.stage{padding:18px 20px;border:1px solid var(--border);border-radius:8px;background:var(--surface);min-width:0}
.stage .bar{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;padding-bottom:10px;border-bottom:1px solid #ecebe4;font-size:12px;color:var(--muted)}
.stage .bar b{color:var(--text)}
.pane{border:1px solid var(--border);border-radius:6px;background:#fff;padding:12px 14px}
.pane h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mut{color:var(--muted);font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #ecebe4;font-size:13.5px;flex-wrap:wrap}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:120px}
mark{background:#fbe7a1;padding:0 2px}
.btn{display:inline-block;padding:6px 12px;border-radius:5px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:12.5px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--border)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:11.5px;flex:0 0 auto}
.avatar.t{background:var(--teal-soft);color:var(--teal)}.avatar.a{background:var(--amber-soft);color:var(--amber)}
.tree{font-size:13.5px}.tree .n{padding:5px 0 5px 0}.tree .n.l2{margin-left:20px}.tree .n.l3{margin-left:40px}.tree .n::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:2px;background:var(--teal)}.tree .n.l2::before{background:var(--blue)}.tree .n.l3::before{background:var(--amber)}
.ev{margin:3px 0 0 48px;padding:6px 10px;border-left:3px solid var(--teal);background:var(--teal-soft);font-size:12.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.bars{display:flex;flex-direction:column;gap:7px}.bars .b{display:grid;grid-template-columns:70px 1fr 90px;gap:8px;align-items:center;font-size:12.5px}.bars .t{height:12px;border-radius:3px;background:#ecebe4;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--teal)}.bars .t i.n{background:#f5c400}
.cmt{display:flex;gap:9px;margin-top:10px;font-size:13px}.cmt .bub{flex:1;padding:8px 10px;border-radius:6px;background:var(--alt);border:1px solid #ecebe4}.cmt .bub b{font-size:12.5px}
.doc{font-family:var(--serif);font-size:15.5px;line-height:1.6}.doc p{margin:0 0 10px}.doc .anch{background:#fbe7a1;border-bottom:2px solid #d9b441}
/* AI decision stage */
.dec .p{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 8px;border-top:1px solid #ecebe4;border-radius:4px;font-size:13.5px}
.dec .p:first-child{border-top:0}
.dec .p .no{color:var(--muted);font-weight:600;font-size:12.5px}
.dec .p .txt{font-family:var(--serif);font-size:14.5px}
.dec .sec{margin:0;padding:6px 8px;font:600 12px/1.3 inherit;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--alt);border-radius:4px}
.pos{padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:6px}
.pos.court{background:var(--teal-soft);color:var(--teal)}.pos.resp{background:#f7e8e3;color:var(--rust)}.pos.app{background:var(--blue-soft);color:var(--blue)}.pos.below{background:var(--amber-soft);color:var(--amber)}
.sum{margin-top:4px;font-size:13px;color:var(--text)}
.blk{margin-top:8px;padding:9px 12px;border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:5px;background:#fff;font-size:13px}
.blk.resp{border-left-color:var(--rust)}.blk.app{border-left-color:var(--blue)}.blk.issue{border-left-color:#1d2a4a;background:#f1f4fb}
.blk b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cite{display:inline-block;padding:1px 8px;border:1px solid #3d5aa8;border-radius:4px;background:#f1f4fb;color:#1d2a4a;font-size:12px;font-weight:600}
.fn{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:#1d2a4a;color:#dbe5ff;font-size:11px;font-weight:700}
.limits{margin-top:12px;padding:10px 14px;border:1px solid var(--text);border-radius:6px;background:var(--alt);font-size:13px}
.limits b{font-family:var(--serif);font-size:15px}
.hl{background:#dbe5ff;outline:2px solid #3d5aa8;border-radius:3px}
.fade{animation:fade .5s ease both}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lop{grid-template-columns:1.1fr .9fr}
.stage,.pane{overflow-wrap:anywhere}
.divider{text-align:center;padding:34px 10px}
.divider h2{margin:10px auto 0;max-width:22ch;font:600 36px/1.15 var(--serif)}
.divider p{max-width:62ch;margin:14px auto 0;font-size:16px}
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 18px;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:0 6px 24px rgba(32,37,34,.16);max-width:calc(100vw - 24px)}
.dock .where{display:flex;flex-direction:column;gap:5px;min-width:170px}.dock .count{font-size:13px;color:var(--muted);white-space:nowrap}
.dock .prog{width:170px;height:4px;border-radius:2px;background:#e6e3d8;overflow:hidden}.dock .prog i{display:block;height:100%;background:var(--teal);transition:width .25s ease}
body.ai .dock .prog i{background:#3d5aa8}
.dock button{min-width:104px;min-height:40px;padding:7px 18px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:#fff;font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
@media(max-width:860px){.lop{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{position:static}.two,.three{grid-template-columns:1fr}.wrap{padding:14px 16px}.dock .prog{width:90px}.dock .where{min-width:100px}.divider h2{font-size:28px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="/data-explorer?tab=about&amp;group=info">ILIT</a><span class="sp"></span><a class="exit" href="/data-explorer?group=roadmap">Leave the preview</a></header>
<div id="ribbon" role="note"></div>
<div class="wrap"><div class="grid" id="grid"><aside class="card" id="card" aria-live="polite"></aside><section class="stage" id="stage"></section></div></div>
<div class="dock"><div class="where"><span class="count" id="count"></span><div class="prog"><i id="prog"></i></div></div><button type="button" id="next">Next</button></div>
<script>
(function(){
var P1="Part 1 · Deterministic improvements",P2="Part 2 · Profiles and teams",P3="Part 3 · Future local AI";
var CHIP={built:'<span class="chip c-built">On the site today</span>',part:'<span class="chip c-blue">Partly on the site</span>',mock:'<span class="chip c-mock">Mock-up</span>',ai:'<span class="chip c-ai">Future local AI · mock-up</span>'};
var RIB_PLAIN='<span>Coming soon preview</span><span>Mock-ups use invented names and numbers</span>';
var RIB_AI='<span>Future · needs a local private AI</span><span>Not part of the site today</span>';

/* ---------- Part 1 ---------- */
function intro(){return '<div class="three">'+
'<div class="pane"><h4>Part 1</h4><b>Better data, still no AI</b><p class="mut">A larger statute and reference library, tags that say more, and decisions that are easier to scan. Works the way the site works today.</p></div>'+
'<div class="pane"><h4>Part 2</h4><b>Profiles and teams</b><p class="mut">Analyst sign-in, joining a team, sharing what was found, and shared documents with comments.</p></div>'+
'<div class="pane" style="border-color:#3d5aa8;background:#f1f4fb"><h4>Part 3</h4><b>Future: a local private AI on top</b><p class="mut">Clearly separate. How a decision could be split into arguments and tied to its citations, and the same idea in the live document reader.</p></div></div>'+
'<div class="row" style="margin-top:14px;border-top:0"><span class="chip c-built">On the site today</span><span class="mut">Exists and works now</span><span class="chip c-mock">Mock-up</span><span class="mut">Shown as a picture, invented data</span><span class="chip c-ai">Future local AI</span><span class="mut">Needs a model that runs on the agency&rsquo;s own machine</span></div>';}
function statutes(){return '<div class="bar">'+CHIP.mock+'<span><b>Statute and reference library</b> · a mock-up of the expanded version</span></div>'+
'<div class="two"><div class="pane"><h4>Sources in the library</h4>'+
'<div class="row"><span class="grow">Federal acts and regulations</span>'+CHIP.built+'</div>'+
'<div class="row"><span class="grow">Tribunal rules (RPD, RAD, ID, IAD)</span>'+CHIP.mock+'</div>'+
'<div class="row"><span class="grow">Ministerial instructions</span>'+CHIP.mock+'</div>'+
'<div class="row"><span class="grow">Operational bulletins</span>'+CHIP.mock+'</div>'+
'<div class="row"><span class="grow">Program delivery instructions</span>'+CHIP.mock+'</div>'+
'<div class="row"><span class="grow">Historic versions of a provision</span>'+CHIP.mock+'</div></div>'+
'<div class="pane"><h4>One provision, everything about it</h4><b style="font-family:var(--serif);font-size:17px">IRPA s. 34(1)(f)</b><div class="mut">Security: membership in an organization</div>'+
'<dl class="kv" style="margin-top:10px"><dt>Text</dt><dd>As in force, with earlier versions</dd><dt>Decisions</dt><dd>Cited in 1,248 decisions, by year, court and outcome</dd><dt>Guidance</dt><dd>Mentioned in 3 bulletins and 2 delivery instructions</dd><dt>Regulations</dt><dd>Linked to the sections that apply it</dd></dl>'+
'<div class="mut" style="margin-top:8px">Counts here are invented for the picture.</div></div></div>';}
function tags(){return '<div class="bar">'+CHIP.mock+'<span><b>Tags</b> · today and with more detail</span></div>'+
'<div class="two"><div class="pane"><h4>Today</h4><div class="row"><span class="chip c-grey">inadmissibility</span><span class="chip c-grey">procedural fairness</span><span class="chip c-grey">credibility finding</span></div><p class="mut">One flat word per issue. Useful for a filter, but it does not say which part of the issue, or where.</p></div>'+
'<div class="pane"><h4>With more detail</h4><div class="tree"><div class="n">Inadmissibility</div><div class="n l2">Security</div><div class="n l3">Membership in an organization <span class="mut">(s. 34(1)(f))</span></div>'+
'<div class="ev">Matched on &ldquo;<mark>member of an organization</mark>&rdquo; at paragraph 41, and on the section reference at paragraph 44.</div>'+
'<div class="n" style="margin-top:6px">Procedural fairness</div><div class="n l2">Duty to give an opportunity to respond</div></div></div></div>'+
'<p class="mut" style="margin:10px 2px 0">Every tag is a fixed rule that points at the words that triggered it, so it can be checked and does not change from one run to the next.</p>';}
function coverage(){return '<div class="bar">'+CHIP.mock+'<span><b>Coverage</b> · what is in the library and how current it is</span></div>'+
'<div class="two"><div class="pane"><h4>Decisions by source</h4><div class="bars">'+
'<div class="b"><span>FC</span><span class="t"><i style="width:92%"></i></span><span class="mut">complete to date</span></div>'+
'<div class="b"><span>FCA</span><span class="t"><i style="width:84%"></i></span><span class="mut">complete to date</span></div>'+
'<div class="b"><span>SCC</span><span class="t"><i style="width:96%"></i></span><span class="mut">complete to date</span></div>'+
'<div class="b"><span>RPD</span><span class="t"><i style="width:55%"></i></span><span class="mut">growing</span></div>'+
'<div class="b"><span>RAD</span><span class="t"><i style="width:40%"></i></span><span class="mut">growing</span></div>'+
'<div class="b"><span>IAD / ID</span><span class="t"><i class="n" style="width:6%"></i></span><span class="mut">not yet</span></div></div></div>'+
'<div class="pane"><h4>Also on the way</h4><div class="row"><span class="grow">French counterparts of English decisions</span>'+CHIP.mock+'</div><div class="row"><span class="grow">New decisions added every day</span>'+CHIP.part+'</div><div class="row"><span class="grow">&ldquo;Last updated&rdquo; shown on every page</span>'+CHIP.mock+'</div><p class="mut">The daily update is built and has been run by hand. It is not scheduled yet. Bars are illustrative.</p></div></div>';}

/* ---------- Part 2 ---------- */
function profile(){return '<div class="bar">'+CHIP.mock+'<span><b>Analyst profile</b> · after agency sign-in</span></div>'+
'<div class="two"><div class="pane"><div class="row" style="border:0"><span class="avatar" style="width:44px;height:44px;font-size:15px">AM</span><div class="grow"><b>A. Morin</b><div class="mut">Analyst · Hearings and Litigation</div></div></div>'+
'<dl class="kv" style="margin-top:8px"><dt>Teams</dt><dd>Section 34 files, Detention reviews</dd><dt>Pinned</dt><dd>14 decisions</dd><dt>Notes</dt><dd>9, private by default</dd></dl></div>'+
'<div class="pane"><h4>What a profile would hold</h4><div class="row"><span class="grow">Pinned decisions and saved searches</span>'+CHIP.part+'</div><div class="row"><span class="grow">Private notes on a decision</span>'+CHIP.part+'</div><div class="row"><span class="grow">Team memberships</span>'+CHIP.mock+'</div><div class="row"><span class="grow">Sign-in through the agency account</span>'+CHIP.mock+'</div><p class="mut">The Workbench already has pins and notes with a demo sign-in. Real sign-in needs agency approval.</p></div></div>';}
function teams(){return '<div class="bar">'+CHIP.mock+'<span><b>Teams</b> · joining one</span></div>'+
'<div class="two"><div class="pane"><h4>Invitation</h4><b style="font-family:var(--serif);font-size:17px">Section 34 files</b><div class="mut">Hearings and Litigation · 7 members</div><div class="row" style="border:0;margin-top:8px"><span class="avatar">LB</span><span class="avatar t">RC</span><span class="avatar a">JD</span><span class="avatar">+4</span></div><div style="margin-top:10px"><span class="btn">Join team</span> <span class="btn ghost">Not now</span></div></div>'+
'<div class="pane"><h4>What joining means</h4><div class="row"><span class="grow">Sees pins and notes the team chose to share</span></div><div class="row"><span class="grow">Sees shared documents and their comments</span></div><div class="row"><span class="grow">Private items stay private</span></div><div class="row"><span class="grow">A lead can add or remove members</span></div></div></div>';}
function insights(){return '<div class="bar">'+CHIP.mock+'<span><b>Team space</b> · shared insights</span></div>'+
'<div class="pane"><h4>Recent from the team</h4>'+
'<div class="cmt" style="margin-top:0"><span class="avatar t">RC</span><div class="bub"><b>R. Caron</b> pinned a decision <span class="mut">· today</span><br>Useful on membership after the organization stopped operating. Paragraphs 38 to 44.</div></div>'+
'<div class="cmt"><span class="avatar">LB</span><div class="bub"><b>L. Bouchard</b> shared a search <span class="mut">· yesterday</span><br>Section 34(1)(f), Federal Court, last 3 years, outcome: allowed.</div></div>'+
'<div class="cmt"><span class="avatar a">JD</span><div class="bub"><b>J. Dunn</b> added a tag note <span class="mut">· Monday</span><br>Two decisions tagged &ldquo;membership&rdquo; are really about complicity.</div></div></div>'+
'<p class="mut" style="margin:10px 2px 0">Names are invented. A shared item is something a person chose to share, nothing is shared automatically.</p>';}
function shareddoc(){return '<div class="bar">'+CHIP.mock+'<span><b>Shared document</b> · comments the team can see</span></div>'+
'<div class="two"><div class="pane doc"><p><b>Draft: submissions on membership</b></p><p>The tribunal must be satisfied on reasonable grounds that the organization engaged in the acts described. <span class="anch">The Court has read &ldquo;member&rdquo; broadly</span> <span class="cite" style="font-family:inherit">[example citation]</span>.</p><p>On these facts, the evidence of involvement was thin.</p></div>'+
'<div class="pane"><h4>Comments · 2</h4><div class="cmt" style="margin-top:0"><span class="avatar t">RC</span><div class="bub"><b>R. Caron</b><br>Add the recent line of cases that narrows this.</div></div><div class="cmt"><span class="avatar">LB</span><div class="bub"><b>L. Bouchard</b><br>Agree. I pinned two in the team space.</div></div><div class="mut" style="margin-top:10px">Draft kept inside the team space. Today, uploaded documents are read in memory and never stored.</div></div></div>';}

/* ---------- Part 3 divider ---------- */
function divider(){return '<div class="divider"><span class="chip c-ai">Future local AI</span><h2>A different kind of improvement</h2><p>Everything so far works without AI, and so will the site. This part imagines a private AI model that runs on the agency&rsquo;s own machine, layered on top. It is not built into the site, nothing is sent to any outside service, and the figures come from small early tests that no lawyer has checked.</p></div>';}

/* ---------- Part 3 decision stage ---------- */
var PAR=[
 ['','Analysis',null],
 ['25','The Respondent asks the Court to dismiss the application as late, as without merit, and as prejudicial.','Respondent asks to dismiss for delay, no merit and prejudice.','resp','Respondent'],
 ['29','The Applicant says he learned of the final decision on December 7.','Applicant says he learned of the decision on December 7.','app','Applicant'],
 ['30','The final decision was only communicated on December 7, so the application was filed in time.','Filed in time: the final decision was only communicated on December 7.','court','Court'],
 ['35','Even if the application were late, the interests of justice favour extending the time.','Even if late, time should be extended in the interests of justice.','court','Court'],
 ['40','The time to file is extended and the matter is returned for a fresh decision.','Time extended; matter returned for a fresh decision.','court','Court']];
function decision(L){var h='<div class="bar">'+CHIP.ai+'<span><b>A decision, split up</b> · invented example in the shape of a real one</span></div><div class="st" data-l="'+L+'"><div class="two lop"><div class="pane dec">';
 PAR.forEach(function(p,i){if(p[2]===null){h+='<div class="sec">'+p[1]+'</div>';return;}
  var cite=(p[0]==='30'&&L>=5)?' <span class="cite">Example v. Canada, 2010 FC 100 at para 18</span><span class="fn">applied the test</span>':'';
  h+='<div class="p'+((L===5&&p[0]==='30')?' hl':'')+'"><span class="no">['+p[0]+']</span><div><div class="txt">'+p[1]+cite+'</div>'+(L>=2?'<div class="sum fade"><span class="pos '+p[3]+'">'+p[4]+'</span>'+p[2]+'</div>':'')+'</div></div>';});
 h+='<div class="mut" style="margin-top:8px">Paragraph text shortened. '+(L<2?'Today the site already numbers paragraphs and carries headings as section titles.':'')+'</div></div><div>';
 if(L<2)h+='<div class="pane"><h4>What exists today</h4><p class="mut" style="margin:0">Numbered paragraphs, headings kept as section titles, an outline, and the citations found in the text. All by fixed rules.</p></div>';
 if(L===2)h+='<div class="pane fade"><h4>Added by the model</h4><p class="mut" style="margin:0">A one-line summary of each paragraph, and whose position it reports: the court&rsquo;s own, a party&rsquo;s, or what the earlier decision-maker found. The court is always the writer; what matters is whose position the paragraph describes.</p></div>';
 if(L===3)h+='<div class="pane fade"><h4>Added by the model</h4><p class="mut" style="margin:0">Paragraphs that mix voices become short lists of propositions.</p><div class="blk app"><b>Applicant · allegation</b>Learned of the decision on December 7.</div><div class="blk"><b>Court · finding, answers the above</b>The decision was only communicated on December 7, so the filing was in time.</div></div>';
 if(L===4)h+='<div class="fade"><div class="blk issue"><b>Issue · paragraphs 25 to 40</b>Was the application late, and should time be extended?</div><div class="blk resp"><b>Respondent · 25</b>Dismiss for delay, no merit, prejudice.</div><div class="blk app"><b>Applicant · 29</b>Learned of the decision on December 7.</div><div class="blk"><b>Court · 30 to 40</b>In time; and if not, extended in the interests of justice.</div></div>';
 if(L===5)h+='<div class="fade"><div class="blk"><b>Court · paragraph 30</b>Filed in time because the decision was only communicated on December 7.</div><div class="blk issue"><b>Authority used here</b><span class="cite">Example v. Canada, 2010 FC 100</span><span class="fn">applied the test</span><div class="mut" style="margin-top:6px">Linked to the issue it supports, and to paragraph 18 of the cited decision, where that rule is stated.</div></div></div>';
 if(L===6)h+='<div class="fade pane"><h4>Read as a short narrative</h4><p style="margin:0;font-size:14px">The question was whether the application was late. The Respondent said it was, and that it lacked merit. The Applicant said he only learned of the decision on December 7. The Court agreed it was filed in time, citing <span class="cite">Example v. Canada</span> for the test, and extended time anyway. <span class="mut">Result: time extended; fresh decision.</span></p></div><div class="limits"><b>What this does not claim.</b> In one small test a single reader judged 24 of 30 paragraph summaries fully right and 6 partly right, on a sample picked to be hard. No lawyer has checked it. Sides are sometimes left &ldquo;not stated&rdquo;, and tribunal text can be mistaken for the court&rsquo;s own.</div>';
 return h+'</div></div></div>';}

/* ---------- Part 3 live reader stage ---------- */
function reader(L){var h='<div class="bar">'+(L===1?CHIP.built:CHIP.ai)+'<span><b>Live Analysis</b> · a fictional memo, read in memory</span></div><div class="two lop"><div class="pane doc">';
 function lab(t){return L>=2?'<span class="pos court fade" style="font-family:inherit;margin-right:6px">'+t+'</span>':'';}
 h+='<p>'+lab('Issue')+'Whether the applicant was a member of the organization within the meaning of s. 34(1)(f).</p>';
 h+='<p'+(L===3?' class="hl"':'')+'>'+lab('Argument')+'The Court has read &ldquo;member&rdquo; broadly <span class="cite" style="font-family:inherit">Example v. Canada, 2010 FC 100</span>.</p>';
 h+='<p>'+lab('Argument')+'Here, the evidence of involvement was thin.</p>';
 h+='<p>'+lab('Conclusion')+'The finding of membership was unreasonable.</p></div><div>';
 if(L===1)h+='<div class="pane"><h4>Found in the memo</h4><div class="row"><span class="grow">Example v. Canada, 2010 FC 100</span>'+CHIP.built+'</div><div class="row"><span class="grow">IRPA s. 34(1)(f)</span>'+CHIP.built+'</div><p class="mut">Cases and statutes the memo cites, linked into the library. The memo is not stored.</p></div>';
 if(L===2)h+='<div class="pane fade"><h4>Structure of the memo</h4><div class="tree"><div class="n">Issue: membership</div><div class="n l2">Argument 1: broad reading of &ldquo;member&rdquo;</div><div class="n l2">Argument 2: thin evidence of involvement</div><div class="n">Conclusion: finding unreasonable</div></div><p class="mut">Found by a local model reading the memo on the same machine. Nothing leaves it.</p></div>';
 if(L===3)h+='<div class="pane fade"><h4>Argument 1 and its authority</h4><span class="cite">Example v. Canada, 2010 FC 100</span><span class="fn">applied the test</span><div class="blk" style="margin-top:8px"><b>In the cited decision · paragraph 18</b>States the rule the memo relies on, and applies it.</div><p class="mut">Shown as a prompt for the analyst to check, not a verdict.</p></div>';
 if(L===4)h+='<div class="pane fade"><h4>How the same issue was argued elsewhere</h4><div class="blk resp"><b>Respondent · seen in 12 decisions</b>Relies on the organization&rsquo;s aims, not on the person&rsquo;s own acts.</div><div class="blk app"><b>Applicant · seen in 9 decisions</b>Points to the absence of any formal tie.</div><div class="blk"><b>Court · most often</b>Looks at the person&rsquo;s actual involvement.</div><p class="mut">Counts are invented. The memo&rsquo;s second argument sits close to that last point.</p></div>';
 return h+'</div></div>';}

function end(){return '<div class="divider"><h2>What stays the same</h2><p>The site works without any AI, and every number on the pages the public sees comes from fixed rules. The ideas in Part 3 would add to that on a machine the agency controls, and the analyst would still decide what to rely on.</p><p><span class="chip c-built">Built</span> <span class="chip c-mock">Mock-up</span> <span class="chip c-ai">Future local AI</span></p></div>';}
