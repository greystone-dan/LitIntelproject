<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:#efede4;color:var(--text);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh;padding-bottom:110px}

.ov .cardy.st{border-left-color:#8a6fb8;background:#f7f2fc}.ov .cardy.gd{border-left-color:var(--teal);background:var(--teal-soft)}

.ov .btnx{display:inline-block;padding:.35em .9em;border-radius:.3em;border:.08em solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:.85em}

.ov .pl{display:inline-block;padding:.05em .6em;border-radius:1em;font-size:.8em;font-weight:700;background:var(--teal-soft);color:var(--teal)}
.pane{border:1px solid var(--border);border-radius:6px;background:#fff;padding:12px 14px}
.pane h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

mark{background:#fbe7a1;padding:0 2px}
.btn{display:inline-block;padding:7px 14px;border-radius:5px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:12.5px}.btn.ghost{background:#fff;color:var(--ink);border-color:var(--border)}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:11.5px;flex:0 0 auto}.avatar.t{background:var(--teal-soft);color:var(--teal)}.avatar.a{background:var(--amber-soft);color:var(--amber)}
.siteh{display:flex;align-items:center;gap:14px;padding:11px 18px;background:var(--surface);border-bottom:1px solid var(--border)}.siteh b.logo{font:700 22px var(--serif);margin-left:auto}.siteh span.nv{font-size:12.5px;font-weight:600;color:var(--muted)}.siteh span.on{background:var(--ink);color:#fff;padding:7px 12px;border-radius:5px}
.pgbg{background:#f1efe8;padding:18px}

.pgbg h2{margin:2px 0 4px;font:700 28px var(--serif)}
.tree{font-size:13.5px}.tree .n{padding:5px 0}.tree .n.l2{margin-left:20px}.tree .n.l3{margin-left:40px}.tree .n::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:2px;background:var(--teal)}.tree .n.l2::before{background:var(--blue)}.tree .n.l3::before{background:var(--amber)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}.kv dt{color:var(--muted)}.kv dd{margin:0}
.bars{display:flex;flex-direction:column;gap:8px}.bars .b{display:grid;grid-template-columns:70px 1fr 100px;gap:8px;align-items:center;font-size:12.5px}.bars .t{height:12px;border-radius:3px;background:#ecebe4;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--teal)}.bars .t i.n{background:#f5c400}
.cmt{display:flex;gap:9px;margin-top:10px;font-size:13px}.cmt .bub{flex:1;padding:8px 10px;border-radius:6px;background:var(--alt);border:1px solid #ecebe4}

.rd{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:420px}
.rd .lp{border-right:1px solid var(--border);padding:0 0 12px;background:var(--surface)}
.rd .lp .tabs{display:flex;border-bottom:1px solid var(--border);font-size:12.5px}.rd .lp .tabs span{flex:1;text-align:center;padding:9px 4px;color:var(--muted)}.rd .lp .tabs span.on{color:var(--text);font-weight:600;border-bottom:2px solid var(--text)}.rd .lp .tabs span.new{border-bottom-color:var(--ai);color:var(--ai)}
.rd .lp .cont{padding:12px 14px;font-size:13px}

.pill{display:inline-block;padding:2px 9px;border-radius:5px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700}
.dec .p{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:8px 6px 8px 8px;border-left:4px solid transparent;border-radius:3px;font-size:13.5px}
.dec .p.court{border-left-color:var(--teal)}.dec .p.resp{border-left-color:var(--rust)}.dec .p.app{border-left-color:var(--blue)}
.dec .p .no{color:var(--muted);font-weight:600;font-size:12.5px}.dec .p .txt{font-family:var(--serif);font-size:14.5px}
.dec .sec{margin:0 0 4px;padding:6px 8px;font:700 13px var(--serif);letter-spacing:.04em;text-transform:uppercase}
.pos{padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;margin-right:6px}
.pos.court{background:var(--teal-soft);color:var(--teal)}.pos.resp{background:var(--rust-soft);color:var(--rust)}.pos.app{background:var(--blue-soft);color:var(--blue)}
.sum{margin-top:4px;font-size:12.5px;font-family:"IBM Plex Sans",system-ui,sans-serif;padding:4px 8px;border-radius:4px;background:var(--ai-soft)}
.blk{margin-top:8px;padding:8px 11px;border:1px solid var(--border);border-left:4px solid var(--teal);border-radius:5px;background:#fff;font-size:12.5px}.blk.resp{border-left-color:var(--rust)}.blk.app{border-left-color:var(--blue)}.blk.issue{border-left-color:#1d2a4a;background:var(--ai-soft)}
.blk b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cite{display:inline-block;padding:1px 8px;border:1px solid var(--ai);border-radius:4px;background:var(--ai-soft);color:#1d2a4a;font-size:12px;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
.fn{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;background:#1d2a4a;color:#dbe5ff;font-size:11px;font-weight:700}
.limits{margin-top:12px;padding:10px 14px;border:1px solid var(--text);border-radius:6px;background:var(--alt);font-size:12.5px}.limits b{font-family:var(--serif);font-size:15px}
.hl{background:#dbe5ff;border-radius:3px}
.fade{animation:fade .5s ease both}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.divider{text-align:center;padding:26px 10px 8px}.divider h2{margin:10px auto 0;max-width:24ch;font:600 34px/1.15 var(--serif)}.divider p{max-width:62ch;margin:14px auto 0;font-size:16px}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0 6px}
.flow .bx{flex:1 1 150px;max-width:200px;padding:12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:12.5px;text-align:left}.flow .bx b{display:block;font-size:13px;margin-bottom:3px}.flow .bx.ai{border-color:var(--ai);background:var(--ai-soft)}.flow .ar{align-self:center;color:var(--muted);font-size:20px}
.collage{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.collage .pane{padding:0;overflow:hidden}.collage .th{height:120px;background-size:cover;background-position:top left;border-bottom:1px solid var(--border)}.collage .tx{padding:12px 14px}
#dim{position:fixed;left:0;top:0;width:0;height:0;border-radius:8px;border:3px solid var(--teal);box-shadow:0 0 0 4px rgba(23,108,104,.16),0 0 0 9999px rgba(32,37,34,.13);pointer-events:none;z-index:30;opacity:0;transition:transform .55s cubic-bezier(.45,0,.2,1),width .55s ease,height .55s ease,opacity .25s ease}
body.ai #dim{border-color:var(--ai);box-shadow:0 0 0 4px rgba(61,90,168,.16),0 0 0 9999px rgba(32,37,34,.13)}
#lock{position:fixed;inset:0;z-index:40}
.dock{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:8px;padding:9px 10px 9px 18px;border:1px solid var(--border);border-radius:10px;background:var(--surface);box-shadow:0 6px 24px rgba(32,37,34,.16);max-width:calc(100vw - 20px)}
.dock .where{display:flex;flex-direction:column;gap:5px;min-width:150px;margin-right:6px}.dock .count{font-size:13px;color:var(--muted);white-space:nowrap}
.dock .prog{width:150px;height:4px;border-radius:2px;background:#e6e3d8;overflow:hidden}.dock .prog i{display:block;height:100%;background:var(--teal);transition:width .25s ease}body.ai .dock .prog i{background:var(--ai)}
.dock button{min-height:40px;padding:7px 16px;border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
.dock button:hover:not(:disabled){border-color:var(--ink)}.dock button:disabled{opacity:.45;cursor:default}
.dock button.primary{min-width:96px;border-color:var(--ink);background:var(--ink);color:#fff}

@media(max-width:860px){.grid{grid-template-columns:1fr}.card{position:static}.two,.three,.collage{grid-template-columns:1fr}.rd,.rd.lib{grid-template-columns:1fr!important}.rd .lp{border-right:0;border-bottom:1px solid var(--border)}.wrap{padding:14px 12px}.dock{gap:4px;padding:8px 8px 8px 12px}.dock .prog{width:70px}.dock .where{min-width:76px}.dock button{padding:7px 10px}.dock .skip{display:none}.divider h2{font-size:27px}.card{padding:16px}}
</style>

<header class="top"><a class="brand" href="/data-explorer?tab=about&amp;group=info">ILIT</a><span class="sp"></span><a class="exit" id="leave" href="/data-explorer?tab=roadmap-overview&amp;group=roadmap">Leave the preview</a></header>

<script>
(function(){
var P0="Preview",P1="Part 1 · Deterministic improvements",P2="Part 2 · Profiles and teams",P3="Part 3 · Future local AI";
var CH={built:'<span class="chip c-built">On the site today</span>',real:'<span class="chip c-built">Real screen</span>',mock:'<span class="chip c-mock">Mock-up</span>',onreal:'<span class="chip c-mock">Mock-up on a real screen</span>',ai:'<span class="chip c-ai">Future local AI · mock-up</span>',part:'<span class="chip c-blue">Partly on the site</span>'};
var RIB_PLAIN='<span>Coming soon preview</span><span>Mock-ups use invented names and numbers</span>';
var RIB_AI='<span>Future · needs a local private AI</span><span>Not part of the site today</span>';
function win(url,chips,inner,flush){return '<div class="win"><div class="wbar"><span class="dots"><i></i><i></i><i></i></span><span class="url">'+url+'</span>'+chips+'</div><div class="body'+(flush?' flush':'')+'">'+inner+'</div></div>';}
function shot(img,W,H,ovs,dim){var h='<div class="shot'+(dim?' dim':'')+'" style="--w:'+W+';aspect-ratio:'+W+'/'+H+'"><img src="/coming-soon-preview/img/'+img+'.webp" alt="" draggable="false">';
 ovs.forEach(function(o){h+='<div class="ov '+(o.c||'')+'"'+(o.f?' data-focus':'')+' style="left:'+(o.x/W*100)+'%;top:'+(o.y/H*100)+'%;width:'+(o.w/W*100)+'%;'+(o.h?'height:'+(o.h/H*100)+'%;':'')+'">'+(o.mk?'<span class="mk">Mock-up</span>':'')+o.html+'</div>';});return h+'</div>';}
function site(active){var t=['About','Case search','Intelligence / Statistics','Workbench','Coming soon'];return '<div class="siteh">'+t.map(function(x){return '<span class="nv'+(x===active?' on':'')+'">'+x+'</span>';}).join('')+'<b class="logo">ILIT</b></div>';}

/* ---------- intro ---------- */
function intro(){function th(i,t,b,c){return '<div class="pane"><div class="th" style="background-image:url(/coming-soon-preview/img/'+i+'.webp)"></div><div class="tx"><h4>'+t+'</h4><b>'+b+'</b><p class="mut" style="margin:4px 0 0">'+c+'</p></div></div>';}
 return '<div class="collage">'+
 th('authorities','Part 1','Better data, still no AI','A larger statute and reference library, tags that say more, and fresher coverage. Works the way the site works today.')+
 th('workbench','Part 2','Profiles and teams','Analyst sign-in, joining a team, sharing what was found, and shared documents with comments.')+
 '<div class="pane" style="border-color:var(--ai)"><div class="th" style="background-image:url(/coming-soon-preview/img/reader.webp);filter:saturate(.6) hue-rotate(190deg)"></div><div class="tx" style="background:var(--ai-soft)"><h4>Part 3</h4><b>Future: a local private AI on top</b><p class="mut" style="margin:4px 0 0">Clearly separate. How a decision could be split into arguments and tied to its citations, and the same in the live document reader.</p></div></div></div>'+
 '<div class="pane" style="margin-top:12px"><div class="row" style="border:0"><span class="chip c-built">On the site today</span><span class="mut">A real screen from the site, as it is now</span></div><div class="row"><span class="chip c-mock">Mock-up</span><span class="mut">A picture of an idea, with invented names and numbers. Where it sits on a real screen, only the highlighted part is invented.</span></div><div class="row"><span class="chip c-ai">Future local AI</span><span class="mut">Needs a model that runs on the agency&rsquo;s own machine</span></div></div>';}

/* ---------- part 1 ---------- */
function tags(){var tree='<div class="pad"><h5>Topics in the text</h5>'+
'<div class="tr"><span class="sq"></span><b>Judicial review</b><span class="ct">12</span></div><div class="tr l2"><span class="sq"></span>Standard of review<span class="ct">9</span></div><div class="tr l3"><span class="sq"></span>Presumption of reasonableness<span class="ct">6</span></div><div class="evd">Matched on &ldquo;<b>reasonableness review</b>&rdquo; at paragraph 2, and on &ldquo;standard of review&rdquo; at paragraph 3.</div>'+
'<div class="tr" style="margin-top:.5em"><span class="sq"></span><b>Administrative law</b><span class="ct">8</span></div><div class="tr l2"><span class="sq"></span>Justification and reasons<span class="ct">5</span></div>'+
